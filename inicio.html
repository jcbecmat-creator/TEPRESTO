<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #05C574;
            --dark-blue: #09384C;
            --bg-light: #f4f7f6;
            --text-main: #333333;
            --border-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor del Menú Lateral (Iframe) */
        .sidebar-container {
            width: 250px;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Área de Contenido Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Barra Superior (Top Bar) */
        .top-bar {
            height: 70px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .welcome-message {
            font-size: 18px;
            color: var(--dark-blue);
            font-weight: 600;
        }

        .welcome-message span {
            color: var(--primary-green);
        }

        .btn-logout {
            background-color: #ffebee;
            color: #d32f2f;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background-color: #ffcdd2;
        }

        /* Panel de Control (Dashboard) */
        .dashboard-area {
            padding: 30px;
        }

        .dashboard-header {
            margin-bottom: 30px;
            color: var(--dark-blue);
        }

        /* Tarjetas de Indicadores (KPIs) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 5px solid var(--primary-green);
        }

        .kpi-card.blue-border {
            border-left-color: var(--dark-blue);
        }

        .kpi-icon {
            width: 60px;
            height: 60px;
            background-color: #e8f8f2;
            color: var(--primary-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .kpi-card.blue-border .kpi-icon {
            background-color: #e6f0f5;
            color: var(--dark-blue);
        }

        .kpi-info h3 {
            margin: 0;
            font-size: 28px;
            color: var(--text-main);
        }

        .kpi-info p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #888888;
        }

        /* Sección de Accesos Rápidos */
        .quick-actions {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .quick-actions h2 {
            margin-top: 0;
            color: var(--dark-blue);
            font-size: 18px;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-action.blue {
            background-color: var(--dark-blue);
        }

        .btn-action:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Menú Lateral Cargado vía Iframe -->
    <div class="sidebar-container">
        <!-- IMPORTANTE: Para que la navegación del menú afecte a toda la página y no solo al iframe, 
             asegúrate de que los enlaces en menu.html tengan el atributo target="_parent" -->
        <iframe src="menu.html" title="Menú de Navegación"></iframe>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="welcome-message">
                Hola, <span id="nombreUsuario">Usuario</span> 👋
            </div>
            <button class="btn-logout" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>

        <!-- Área del Dashboard -->
        <div class="dashboard-area">
            <h1 class="dashboard-header">Resumen de Actividad</h1>

            <!-- Tarjetas de Indicadores -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div class="kpi-info">
                        <h3>14</h3>
                        <p>Solicitudes de Préstamo</p>
                    </div>
                </div>

                <div class="kpi-card blue-border">
                    <div class="kpi-icon"><i class="fas fa-hand-holding-usd"></i></div>
                    <div class="kpi-info">
                        <h3>8</h3>
                        <p>Inversionistas Activos</p>
                    </div>
                </div>

                <div class="kpi-card">
                    <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="kpi-info">
                        <h3>24</h3>
                        <p>Expedientes Aprobados</p>
                    </div>
                </div>
            </div>

            <!-- Accesos Rápidos -->
            <div class="quick-actions">
                <h2>Accesos Rápidos</h2>
                <div class="action-buttons">
                    <a href="solicitudes_cliente.html" class="btn-action blue">
                        <i class="fas fa-search-dollar"></i> Revisar Préstamos
                    </a>
                    <a href="solicitudes_inversionista.html" class="btn-action">
                        <i class="fas fa-users"></i> Revisar Inversionistas
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Inicialización de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDkzzRJ1Ovt0OelBCnaemMpnaoesnziKn0",
            authDomain: "prestamas-36107.firebaseapp.com",
            projectId: "prestamas-36107",
            storageBucket: "prestamas-36107.firebasestorage.app",
            messagingSenderId: "664528103707",
            appId: "1:664528103707:web:0b56c9ea098cf8709e4bbe"
        };

        const app = initializeApp(firebaseConfig);
    </script>

    <!-- Lógica de Sesión -->
    <script>
        // Al cargar la página, verificamos si el usuario inició sesión
        window.onload = function() {
            var usuarioActivo = localStorage.getItem('usuario');
            var nombreActivo = localStorage.getItem('nombre');

            // Si no hay usuario guardado, lo regresamos al index (Login)
            if (!usuarioActivo) {
                window.location.href = "index.html";
            } else {
                // Si hay usuario, mostramos su nombre en la parte superior
                document.getElementById('nombreUsuario').innerText = nombreActivo || usuarioActivo;
            }
        };

        // Función para cerrar sesión
        function cerrarSesion() {
            // Limpiamos los datos del navegador
            localStorage.removeItem('usuario');
            localStorage.removeItem('privilegio');
            localStorage.removeItem('nombre');
            
            // Redirigimos al Login
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
