<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Inversionistas - PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* MISMOS ESTILOS DEL INVERSIONISTA (VERDE EN EL ENCABEZADO DE TABLA) */
        :root { --primary-green: #05C574; --dark-blue: #09384C; --bg-light: #f4f7f6; --text-main: #2c3e50; --border-color: #e0e0e0; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-light); height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar-wrapper { width: 260px; height: 100vh; background-color: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 1000; flex-shrink: 0; transition: transform 0.3s ease; }
        .sidebar-wrapper iframe { width: 100%; height: 100%; border: none; display: block; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(9, 56, 76, 0.5); z-index: 999; }
        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-stripe, .bottom-stripe { background-color: var(--primary-green); height: 12px; width: 100%; flex-shrink: 0; }
        .mobile-header { display: none; background: #ffffff; padding: 15px 20px; border-bottom: 1px solid var(--border-color); align-items: center; justify-content: space-between; }
        .mobile-header img { height: 35px; }
        .hamburger-btn { background: transparent; border: none; font-size: 24px; color: var(--dark-blue); cursor: pointer; }
        .content-area { padding: 40px; flex-grow: 1; box-sizing: border-box; width: 100%; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .section-title { color: var(--dark-blue); margin: 0; font-size: 24px; }
        .table-container { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--primary-green); /* VERDE */ color: #ffffff; padding: 18px 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 15px; color: var(--text-main); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fcfcfc; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
        .badge-active { background-color: #e8f9f1; color: var(--primary-green); }
        .badge-verifying { background-color: #fff3cd; color: #856404; }
        .btn-action { background-color: transparent; color: var(--dark-blue); border: 1px solid var(--dark-blue); padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.3s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-action:hover { background-color: var(--dark-blue); color: #ffffff; }
        
        /* FOTO Y MODAL */
        .thumb-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid var(--border-color); transition: all 0.3s; }
        .thumb-img:hover { border-color: var(--primary-green); transform: scale(1.1); }
        .modal { display: none; position: fixed; z-index: 2000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 85vh; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close-modal:hover { color: #bbb; }

        @media (max-width: 900px) { .sidebar-wrapper { position: fixed; left: -260px; } .sidebar-wrapper.open { transform: translateX(260px); } .sidebar-overlay.open { display: block; } .mobile-header { display: flex; } .content-area { padding: 20px; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar-wrapper" id="sidebar"><iframe src="menu.html" title="Menú de Navegación"></iframe></aside>
        
        <main class="main-wrapper">
            <div class="top-stripe"></div>
            <div class="mobile-header">
                <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <img src="https://i.ibb.co/xK0VgNm2/LOGOTIPO-1.jpg" alt="Logo PrestaMas">
            </div>

            <div class="content-area">
                <div class="header-section">
                    <h1 class="section-title"><i class="fas fa-hand-holding-usd" style="color: var(--primary-green);"></i> Solicitudes de Inversiones</h1>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th> <th>ID Cuenta</th>
                                <th>Inversionista</th>
                                <th>Monto Proyectado</th>
                                <th>Estado Cuenta</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><img src="https://i.pravatar.cc/150?img=13" class="thumb-img" onclick="abrirModal(this.src)" alt="Foto"></td>
                                <td><strong>#INV-10045</strong></td>
                                <td>Roberto Gómez</td>
                                <td>$10,001 a $30,000</td>
                                <td><span class="badge badge-active">Verificado</span></td>
                                <td><button class="btn-action" onclick="window.location.href='perfilinversionista.html'"><i class="fas fa-eye"></i> Ver perfil</button></td>
                            </tr>
                            <tr>
                                <td><img src="https://i.pravatar.cc/150?img=9" class="thumb-img" onclick="abrirModal(this.src)" alt="Foto"></td>
                                <td><strong>#INV-10046</strong></td>
                                <td>Ana Sofía Martínez</td>
                                <td>$0 a $10,000</td>
                                <td><span class="badge badge-verifying">Validando Origen</span></td>
                                <td><button class="btn-action" onclick="window.location.href='perfilinversionista.html'"><i class="fas fa-eye"></i> Ver perfil</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="bottom-stripe"></div>
        </main>
    </div>

    <div id="fotoModal" class="modal">
        <span class="close-modal" onclick="cerrarModal()">&times;</span>
        <img class="modal-content" id="imgAmpliacion">
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
        function abrirModal(src) { document.getElementById('fotoModal').style.display = "block"; document.getElementById('imgAmpliacion').src = src; }
        function cerrarModal() { document.getElementById('fotoModal').style.display = "none"; }
    </script>
</body>
</html>
