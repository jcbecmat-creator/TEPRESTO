<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Préstamo - PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #05C574;
            --dark-blue: #09384C;
            --bg-light: #f4f7f6;
            --text-main: #333333;
            --border-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Franjas Verdes */
        .top-stripe, .bottom-stripe {
            background-color: var(--primary-green);
            height: 15px;
            width: 100%;
        }
        .bottom-stripe { margin-top: auto; }

        header {
            background-color: #ffffff;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-img { height: 40px; }

        .btn-back {
            background: transparent;
            color: var(--dark-blue);
            border: 1px solid var(--dark-blue);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-back:hover { background: var(--dark-blue); color: white; }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 40px;
            box-sizing: border-box;
        }

        h1 { color: var(--dark-blue); text-align: center; margin-top: 0; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .controls-section {
            background-color: #fcfcfc;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
        }

        .amount-display {
            font-size: 32px;
            color: var(--primary-green);
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        input[type="range"] { width: 100%; accent-color: var(--primary-green); margin-bottom: 20px; }

        .months-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .month-btn {
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .month-btn.active { background-color: var(--dark-blue); color: white; }

        .results-section {
            background-color: var(--dark-blue);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .monthly-payment {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary-green);
            margin: 10px 0;
        }

        .btn-cta {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
        }

        @media (max-width: 768px) { .calculator-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="top-stripe"></div>

    <header>
        <img src="https://i.ibb.co/xK0VgNm2/LOGOTIPO-1.jpg" class="logo-img" alt="PrestaMas">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</a>
    </header>

    <div class="container">
        <h1>Simulador de Préstamos</h1>
        <p class="subtitle">Descubre tu pago mensual sin letras chiquitas.</p>

        <div class="calculator-grid">
            <div class="controls-section">
                <label style="font-weight:bold; color:var(--dark-blue);">¿Cuánto dinero necesitas?</label>
                <div class="amount-display" id="montoDisplay">$50,000</div>
                <input type="range" id="montoRango" min="5000" max="300000" step="1000" value="50000">

                <label style="font-weight:bold; color:var(--dark-blue); display:block; margin-bottom:10px;">Plazo a pagar</label>
                <div class="months-grid">
                    <div class="month-btn" data-meses="6">6 meses</div>
                    <div class="month-btn" data-meses="12">12 meses</div>
                    <div class="month-btn" data-meses="18">18 meses</div>
                    <div class="month-btn active" data-meses="24">24 meses</div>
                    <div class="month-btn" data-meses="30">30 meses</div>
                    <div class="month-btn" data-meses="36">36 meses</div>
                </div>
            </div>

            <div class="results-section">
                <h3>Tu pago mensual estimado</h3>
                <div class="monthly-payment" id="pagoDisplay">$2,538</div>
                <p style="font-size:13px; color:#a8c1cf;">Tasa promedio anual del 18.9%*</p>
            </div>
        </div>

        <button class="btn-cta" onclick="window.location.href='perfilcliente.html'">Solicitar mi préstamo ahora</button>
    </div>

    <div class="bottom-stripe"></div>

    <script>
        const montoRango = document.getElementById('montoRango');
        const montoDisplay = document.getElementById('montoDisplay');
        const pagoDisplay = document.getElementById('pagoDisplay');
        const botonesMeses = document.querySelectorAll('.month-btn');

        let mesesSeleccionados = 24;
        const tasaAnualPromedio = 0.189;
        const formatoMoneda = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });

        function calcularPagoMensual(principal, tasaAnual, meses) {
            const tasaMensual = tasaAnual / 12;
            return principal * (tasaMensual * Math.pow(1 + tasaMensual, meses)) / (Math.pow(1 + tasaMensual, meses) - 1);
        }

        function actualizarSimulador() {
            const monto = parseFloat(montoRango.value);
            montoDisplay.innerText = formatoMoneda.format(monto);
            pagoDisplay.innerText = formatoMoneda.format(calcularPagoMensual(monto, tasaAnualPromedio, mesesSeleccionados));
        }

        botonesMeses.forEach(boton => {
            boton.addEventListener('click', function() {
                botonesMeses.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                mesesSeleccionados = parseInt(this.getAttribute('data-meses'));
                actualizarSimulador();
            });
        });

        montoRango.addEventListener('input', actualizarSimulador);
        actualizarSimulador();
    </script>
</body>
</html>
