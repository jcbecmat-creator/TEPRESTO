<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiero Prestar - Simula tu Inversión | PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #05C574;
            --dark-blue: #09384C;
            --light-green-bg: #f8f9fa;
            --text-dark: #333333;
            --border-color: #cccccc;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Franjas Verdes */
        .top-stripe, .bottom-stripe {
            background-color: var(--primary-green);
            height: 15px;
            width: 100%;
        }

        .bottom-stripe {
            margin-top: auto;
        }

        /* Encabezado */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .main-logo {
            width: 200px;
            height: auto;
        }

        .btn-back {
            background: transparent;
            color: var(--dark-blue);
            border: 1px solid var(--dark-blue);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: var(--dark-blue);
            color: white;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            flex-grow: 1;
        }

        .calculator-wrapper {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        /* Panel Izquierdo */
        .form-section {
            flex: 0.8;
        }

        .form-section h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--dark-blue);
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .input-inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-inline-group input {
            flex: 1;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .input-inline-group input:focus {
            border-color: var(--primary-green);
        }

        .btn-simular {
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            padding: 16px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-simular:hover {
            background-color: #04A863;
        }

        /* Panel Derecho */
        .results-section {
            flex: 1.5;
            background-color: var(--light-green-bg);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .results-section h3 {
            font-size: 22px;
            margin-top: 0;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-empezar {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .calculator-wrapper { flex-direction: column; }
            .form-section, .results-section { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-stripe"></div>

    <div class="header">
        <img src="https://i.ibb.co/xK0VgNm2/LOGOTIPO-1.jpg" alt="Logo PrestaMas" class="main-logo">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>

    <div class="container">
        <div class="calculator-wrapper">
            <div class="form-section">
                <h1>Simula tu inversión</h1>
                <div class="input-group">
                    <label>¿Cuánto quieres invertir?</label>
                    <div class="input-inline-group">
                        <input type="number" id="montoInversion" value="5000" min="1000" step="1000">
                        <button class="btn-simular" onclick="simularInversion()">Simular</button>
                    </div>
                </div>
            </div>

            <div class="results-section">
                <h3>Rendimiento Anual Estimado: 16.52%</h3>
                <div class="chart-container">
                    <canvas id="rendimientoChart"></canvas>
                </div>
                <a href="perfilinversionista.html" class="btn-empezar">Empezar a invertir</a>
            </div>
        </div>
    </div>

    <div class="bottom-stripe"></div>

    <script>
        const ctx = document.getElementById('rendimientoChart').getContext('2d');
        let chartInstance = null;
        const TASA_ANUAL = 0.1652;

        function simularInversion() {
            let montoBase = parseFloat(document.getElementById('montoInversion').value);
            if (isNaN(montoBase) || montoBase <= 0) return alert("Ingresa un monto válido");

            const anos = [1, 2, 3, 4, 5];
            const datosInversion = [];
            const datosTotal = [];

            anos.forEach(ano => {
                datosInversion.push(montoBase);
                datosTotal.push(montoBase * Math.pow((1 + TASA_ANUAL), ano));
            });

            if (chartInstance) {
                chartInstance.data.datasets[0].data = datosInversion;
                chartInstance.data.datasets[1].data = datosTotal;
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['1 año', '2 años', '3 años', '4 años', '5 años'],
                        datasets: [
                            { label: 'Inversión', data: datosInversion, backgroundColor: '#7f8c8d' },
                            { label: '+ Rendimiento', data: datosTotal, backgroundColor: '#05C574' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }
        window.onload = simularInversion;
    </script>
</body>
</html>
