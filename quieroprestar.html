<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Inversión - PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Importar Chart.js para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #05C574;
            --dark-blue: #09384C;
            --bg-light: #f4f7f6;
            --text-main: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #ffffff;
            padding: 15px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .logo-img { height: 40px; }

        .btn-back {
            background: transparent;
            color: var(--dark-blue);
            border: 1px solid var(--dark-blue);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: var(--dark-blue);
            color: white;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 40px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 40px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--dark-blue);
            text-align: center;
            margin-top: 0;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .controls-section {
            background-color: #fcfcfc;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 10px;
            font-size: 15px;
        }

        .amount-display {
            font-size: 32px;
            color: var(--primary-green);
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-green);
        }

        .results-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 20px;
        }

        .result-card {
            flex: 1;
            background: #e8f9f1;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #c3eadd;
        }

        .result-card h3 {
            margin: 0;
            font-size: 14px;
            color: #555;
            text-transform: uppercase;
        }

        .result-card p {
            margin: 10px 0 0 0;
            font-size: 24px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin-bottom: 30px;
        }

        .btn-cta {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cta:hover {
            opacity: 0.9;
            box-shadow: 0 4px 10px rgba(5, 197, 116, 0.3);
        }

    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/xK0VgNm2/LOGOTIPO-1.jpg" class="logo-img" alt="PrestaMas">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </header>

    <div class="container">
        <h1>Simulador de Inversión</h1>
        <p class="subtitle">Descubre cuánto puede crecer tu dinero invirtiendo en PrestaMas con una tasa estimada del 16% anual.</p>

        <div class="controls-section">
            <div class="input-group">
                <label>¿Cuánto dinero quieres invertir?</label>
                <div class="amount-display" id="montoDisplay">$10,000 MXN</div>
                <input type="range" id="montoRango" min="1000" max="100000" step="1000" value="10000">
            </div>
        </div>

        <div class="results-section">
            <div class="result-card">
                <h3>Ganancia Estimada (5 Años)</h3>
                <p id="gananciaDisplay">$11,003</p>
            </div>
            <div class="result-card" style="background-color: #e6f0f5; border-color: #c2d6e0;">
                <h3>Valor Total de tu Cuenta</h3>
                <p id="totalDisplay">$21,003</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="investmentChart"></canvas>
        </div>

        <button class="btn-cta" onclick="window.location.href='perfilinversionista.html'">
            Crear cuenta y comenzar a invertir
        </button>
    </div>

    <!-- Lógica del Simulador y la Gráfica -->
    <script>
        const montoRango = document.getElementById('montoRango');
        const montoDisplay = document.getElementById('montoDisplay');
        const gananciaDisplay = document.getElementById('gananciaDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const ctx = document.getElementById('investmentChart').getContext('2d');
        
        let investmentChart;
        const tasaAnual = 0.16; // 16% estimado
        const anios = [1, 2, 3, 4, 5];

        // Formatear a moneda
        const formatoMoneda = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });

        function calcularInversion(montoInicial) {
            let valores = [];
            for (let i = 1; i <= 5; i++) {
                // Interés compuesto simple
                let valorFuturo = montoInicial * Math.pow((1 + tasaAnual), i);
                valores.push(valorFuturo);
            }
            return valores;
        }

        function actualizarSimulador() {
            const monto = parseFloat(montoRango.value);
            montoDisplay.innerText = formatoMoneda.format(monto) + " MXN";

            const proyecciones = calcularInversion(monto);
            const valorFinal = proyecciones[4];
            const ganancia = valorFinal - monto;

            gananciaDisplay.innerText = formatoMoneda.format(ganancia);
            totalDisplay.innerText = formatoMoneda.format(valorFinal);

            actualizarGrafica(monto, proyecciones);
        }

        function actualizarGrafica(montoInicial, proyecciones) {
            // Añadir el año 0 para la gráfica
            const datos = [montoInicial, ...proyecciones];
            const etiquetas = ['Hoy', 'Año 1', 'Año 2', 'Año 3', 'Año 4', 'Año 5'];

            if (investmentChart) {
                investmentChart.data.datasets[0].data = datos;
                investmentChart.update();
            } else {
                investmentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: etiquetas,
                        datasets: [{
                            label: 'Crecimiento de Inversión',
                            data: datos,
                            borderColor: '#05C574',
                            backgroundColor: 'rgba(5, 197, 116, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#09384C',
                            pointRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return formatoMoneda.format(context.raw);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toLocaleString();
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        // Listeners
        montoRango.addEventListener('input', actualizarSimulador);

        // Inicializar
        actualizarSimulador();
    </script>

</body>
</html>
