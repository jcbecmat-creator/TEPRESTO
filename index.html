<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PrestaMas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #05C574;
            --dark-blue: #09384C;
            --bg-light: #f4f7f6;
            --text-main: #2c3e50;
            --border-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal Flex */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- MENÚ LATERAL (IFRAME) --- */
        .sidebar-wrapper {
            width: 260px;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 1000;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Fondo oscuro para móvil al abrir menú */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 56, 76, 0.5);
            z-index: 999;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Franjas Verdes */
        .top-stripe, .bottom-stripe {
            background-color: var(--primary-green);
            height: 12px;
            width: 100%;
            flex-shrink: 0;
        }

        /* Encabezado Móvil (Oculto en PC) */
        .mobile-header {
            display: none;
            background: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
        }

        .mobile-header img {
            height: 35px;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            color: var(--dark-blue);
            cursor: pointer;
        }

        /* Encabezado PC */
        .page-header {
            background-color: #ffffff;
            padding: 25px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .welcome-message {
            font-size: 22px;
            color: var(--text-main);
            font-weight: 600;
            margin: 0;
        }

        .welcome-message span {
            color: var(--primary-green);
        }

        /* Área de Trabajo (Dashboard expandido) */
        .content-area {
            padding: 40px;
            flex-grow: 1;
            box-sizing: border-box;
            width: 100%;
        }

        .section-title {
            color: var(--dark-blue);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* KPIs (Tarjetas a todo lo ancho) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
            width: 100%;
        }

        .kpi-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 5px solid var(--primary-green);
        }

        .kpi-card.blue-border { border-left-color: var(--dark-blue); }

        .kpi-icon {
            width: 60px;
            height: 60px;
            background-color: #f4f7f6;
            color: var(--primary-green);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .kpi-card.blue-border .kpi-icon { color: var(--dark-blue); }

        .kpi-info h3 { margin: 0; font-size: 32px; color: var(--text-main); }
        .kpi-info p { margin: 5px 0 0 0; font-size: 15px; color: #666; font-weight: 500;}

        /* --- NUEVO: SECCIÓN DE GRÁFICAS --- */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr; /* Líneas más ancha, pastel más delgada */
            gap: 25px;
            margin-bottom: 40px;
            width: 100%;
        }

        .chart-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }

        .chart-card h3 {
            margin-top: 0;
            color: var(--dark-blue);
            font-size: 18px;
            margin-bottom: 20px;
        }

        .canvas-container {
            position: relative;
            height: 280px;
            width: 100%;
        }

        /* Accesos Rápidos */
        .quick-actions {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 40px;
        }

        .action-buttons { display: flex; gap: 20px; flex-wrap: wrap; }

        .btn-action {
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            padding: 16px 30px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 15px;
        }

        .btn-action.blue { background-color: var(--dark-blue); }
        .btn-action:hover { opacity: 0.9; }

        /* --- RESPONSIVIDAD (MÓVIL Y TABLET) --- */
        @media (max-width: 1100px) {
            .charts-grid { grid-template-columns: 1fr; } /* Gráficas apiladas en pantallas pequeñas */
        }

        @media (max-width: 900px) {
            .sidebar-wrapper { position: fixed; left: -260px; }
            .sidebar-wrapper.open { transform: translateX(260px); }
            .sidebar-overlay.open { display: block; }
            .mobile-header { display: flex; }
            .content-area { padding: 20px; }
            .page-header { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar-wrapper" id="sidebar">
            <iframe src="menu.html" title="Menú de Navegación"></iframe>
        </aside>

        <main class="main-wrapper">
            <div class="top-stripe"></div>

            <div class="mobile-header">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <img src="https://i.ibb.co/xK0VgNm2/LOGOTIPO-1.jpg" alt="Logo PrestaMas">
            </div>

            <header class="page-header">
                <h1 class="welcome-message">Bienvenido, <span id="nombreUsuario">Usuario</span></h1>
            </header>

            <div class="content-area">
                <h2 class="section-title">Resumen de Actividad</h2>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                        <div class="kpi-info">
                            <h3>14</h3>
                            <p>Créditos Solicitados</p>
                        </div>
                    </div>

                    <div class="kpi-card blue-border">
                        <div class="kpi-icon"><i class="fas fa-hand-holding-usd"></i></div>
                        <div class="kpi-info">
                            <h3>8</h3>
                            <p>Inversiones Activas</p>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="kpi-info">
                            <h3>24</h3>
                            <p>Expedientes Aprobados</p>
                        </div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>Evolución de Solicitudes (Últimos 6 meses)</h3>
                        <div class="canvas-container">
                            <canvas id="lineChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <h3>Estado de la Cartera</h3>
                        <div class="canvas-container">
                            <canvas id="doughnutChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="quick-actions">
                    <h2 class="section-title" style="font-size: 18px; margin-bottom: 20px;">Accesos Rápidos</h2>
                    <div class="action-buttons">
                        <a href="solicitudes_cliente.html" class="btn-action blue">
                            <i class="fas fa-search-dollar"></i> Revisar Créditos
                        </a>
                        <a href="solicitudes_inversionista.html" class="btn-action">
                            <i class="fas fa-users"></i> Revisar Inversiones
                        </a>
                    </div>
                </div>
            </div>

            <div class="bottom-stripe"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        const firebaseConfig = {
            apiKey: "AIzaSyDkzzRJ1Ovt0OelBCnaemMpnaoesnziKn0",
            authDomain: "prestamas-36107.firebaseapp.com",
            projectId: "prestamas-36107",
            storageBucket: "prestamas-36107.firebasestorage.app",
            messagingSenderId: "664528103707",
            appId: "1:664528103707:web:0b56c9ea098cf8709e4bbe"
        };
        const app = initializeApp(firebaseConfig);
    </script>

    <script>
        // Lógica de sesión
        window.onload = function() {
            var usuarioActivo = localStorage.getItem('usuario');
            var nombreActivo = localStorage.getItem('nombre');
            if (!usuarioActivo) {
                window.location.href = "index.html";
            } else {
                document.getElementById('nombreUsuario').innerText = nombreActivo || usuarioActivo;
            }
            
            // Inicializar las gráficas al cargar la página
            initCharts();
        };

        // Lógica para abrir/cerrar menú en celular
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // LÓGICA DE LAS GRÁFICAS (Chart.js)
        function initCharts() {
            // 1. Gráfica de Líneas (Evolución)
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['Dic', 'Ene', 'Feb', 'Mar', 'Abr', 'May'],
                    datasets: [
                        {
                            label: 'Créditos Solicitados',
                            data: [5, 8, 12, 10, 15, 14],
                            borderColor: '#09384C', // Azul oscuro
                            backgroundColor: 'rgba(9, 56, 76, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Nuevas Inversiones',
                            data: [2, 3, 5, 4, 7, 8],
                            borderColor: '#05C574', // Verde principal
                            backgroundColor: 'rgba(5, 197, 116, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // 2. Gráfica de Anillo (Estado de Cartera)
            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: ['Aprobados', 'En Revisión', 'Pendientes Doc.'],
                    datasets: [{
                        data: [24, 6, 4],
                        backgroundColor: [
                            '#05C574', // Verde (Aprobado)
                            '#09384C', // Azul (Revisión)
                            '#f39c12'  // Naranja (Pendiente)
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%', // Hueco del anillo
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }
    </script>
</body>
</html>
